name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Linter
        run: npm run lint --if-present
        
      - name: Run Tests
        run: npm test

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 3232
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /home/minhhan/ticket-bot-zalo
            git reset --hard
            git pull origin main
            npm install --production
            pm2 restart all

  notify:
    name: Discord Notification
    needs: [ci, cd]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on Completion
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          CI_STATUS: ${{ needs.ci.result }}
          CD_STATUS: ${{ needs.cd.result }}
        run: |
          if [ "$CI_STATUS" = "success" ] && [ "$CD_STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="65280"
            OVERALL_STATUS="Thành công"
          else
            EMOJI="❌"
            COLOR="16711680"
            if [ "$CI_STATUS" != "success" ]; then
              OVERALL_STATUS="Thất bại tại vòng CI (Kiểm tra Code)"
            else
              OVERALL_STATUS="Thất bại tại vòng CD (Đẩy lên Server)"
            fi
          fi
          
          # Safely construct JSON payload using jq string interpolation
          PAYLOAD=$(jq -n \
            --arg username "$REPO (CI/CD)" \
            --arg title "$EMOJI Trạng thái Deploy" \
            --arg repo "$REPO" \
            --arg status "$OVERALL_STATUS" \
            --arg msg "$COMMIT_MSG" \
            --arg actor "$ACTOR" \
            --argjson color "$COLOR" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                description: "Dự án: **\( $repo )**\nKết quả: **\( $status )**\nNội dung: **\( $msg )**\nThực hiện bởi: **\( $actor )**",
                color: $color
              }]
            }')
            
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" ${{ secrets.DISCORD_WEBHOOK_URL }}