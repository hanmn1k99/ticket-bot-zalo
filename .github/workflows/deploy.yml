name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 3232
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /home/minhhan/ticket-bot-zalo
            git reset --hard
            git pull origin main
            npm install
            pm2 restart all

      - name: Notify Discord on Completion
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_HASH: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            EMOJI="✅"
            COLOR="65280"
          else
            EMOJI="❌"
            COLOR="16711680"
          fi
          
          # Shorten hash
          SHORT_HASH=$(echo $COMMIT_HASH | cut -c1-7)
          
          # Safely construct JSON payload using jq
          PAYLOAD=$(jq -n \
            --arg username "$REPO (CI/CD)" \
            --arg title "$EMOJI Trạng thái Deploy" \
            --arg desc "Dự án: **$REPO**\nKết quả: **$JOB_STATUS**\nNội dung Commit: *$COMMIT_MSG*\nHash: [\`$SHORT_HASH\`](https://github.com/$REPO/commit/$COMMIT_HASH)\nThực hiện bởi: **$ACTOR**" \
            --argjson color "$COLOR" \
            '{
              username: $username,
              embeds: [{
                title: $title,
                description: $desc,
                color: $color
              }]
            }')
            
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" https://discordapp.com/api/webhooks/1546123810598551652/jFaAxDkyq4cqywUtiw8MJnK_QUt_TBzUjPVc9BpaNvdxMjY4IB0u9v9UVxuam7DYqkKu